version: 1
name: universal-agent-engineering-kernel
scope: multi-project
purpose:
  - establish one reusable engineering workflow for agent-led software development
  - stop serious work from starting as chat-only improvisation
  - preserve PRD-first execution and GitHub issue decomposition across repositories
  - keep the shared process model-agnostic across GPT/Codex and Claude-style agents
  - allow one operator machine to notice kernel drift across many consumer repos without blind auto-sync

layers:
  minimal_core:
    - project_local_canon
    - prd_first_execution
    - agent_skill_orchestration_policy
    - agentic_coding_orchestration_policy
    - project_local_worker_policy
    - mcp_tooling_policy
    - research_policy
    - execution_surface_policy
    - optional_behavioral_overlay_policy
    - kernel_upstream_awareness_policy
    - kernel_adoption_task_policy
    - kernel_sync_policy
    - github_issue_tree
    - automatic_bug_intake
    - github_delivery_flow
    - pr_verification_contract
    - ownership_and_metadata
  maximum_practical_core:
    - protected_branch_or_ruleset_enforcement
    - required_approvals
    - stale_review_dismissal
    - code_owner_review
    - required_status_checks
    - github_projects_and_issue_types
    - merge_policy_enforcement
    - automatic_head_branch_deletion

project_local_canon:
  required_files:
    - README.md
    - AGENTS.md
    - CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - SECURITY.md
  required_sections:
    - source_of_truth
    - workflow_order
    - verification_matrix
    - rollback_rule
  rules:
    - prefer_project_local_canon_over_chat_memory
    - create_local_canon_if_missing

prd_first_execution:
  order:
    - research
    - code_audit
    - reconciliation
    - documentation_first
    - baseline_verification
    - implementation
    - post_change_verification
  rules:
    - non_trivial_work_must_not_start_with_code
    - verification_defined_before_edits
    - capture_smallest_relevant_baseline_verification_before_edits_when_existing_contract_exists
    - bugfix_slices_prefer_reproducer_before_fix
    - refactor_slices_prefer_before_and_after_equivalence_checks
    - docs_only_canon_only_or_greenfield_slices_may_skip_pre_change_baseline_if_no_existing_contract_exists
    - docs_and_prd_are_part_of_the_slice

agent_skill_orchestration_policy:
  preferred_skill_pack: Superpowers
  role:
    - tactical_agent_process_layer
    - not_the_source_of_truth_for_project_requirements_or_repo_canon
  priority_order:
    - direct_user_instruction
    - project_local_canon_and_active_prd
    - engineering_kernel
    - applicable_superpowers_or_equivalent_process_skill
    - model_default_behavior
  canonical_skill_triggers:
    project_or_feature_design:
      - using-superpowers
      - brainstorming
    approved_spec_or_multi_step_requirements:
      - writing-plans
    implementation_or_bugfix:
      - test-driven-development
    bug_failure_or_unexpected_behavior:
      - systematic-debugging
    isolated_branch_work:
      - using-git-worktrees
    independent_parallel_work:
      - dispatching-parallel-agents
    plan_execution_with_subagents:
      - subagent-driven-development
    plan_execution_without_subagents:
      - executing-plans
    code_review_request_or_response:
      - requesting-code-review
      - receiving-code-review
    completion_claim_or_pr_ready:
      - verification-before-completion
      - finishing-a-development-branch
    skill_authoring:
      - writing-skills
  rules:
    - when_a_relevant_superpowers_skill_or_equivalent_process_skill_is_available_the_agent_must_read_or_invoke_it_before_acting
    - superpowers_skills_shape_how_the_agent_works_but_do_not_replace_prd_first_issue_first_or_verification_contracts
    - project_local_canon_active_prd_and_explicit_user_instructions_override_skill_defaults
    - prefer_skill_backed_brainstorming_for_new_behavior_before_writing_code
    - prefer_skill_backed_planning_for_multi_step_work_before_touching_code
    - bugfixes_use_systematic_debugging_before_fixes_and_tdd_for_regression_protection
    - completion_claims_require_fresh_verification_evidence
    - subagent_or_parallel_skill_work_requires_platform_support_and_user_or_project_permission
    - if_skill_tooling_is_unavailable_apply_the_same_principles_manually_and_record_the_gap_when_it_affects_the_slice
    - do_not_copy_vendor_skill_text_into_project_canon_when_a_small_mapping_or_reference_is_sufficient

agentic_coding_orchestration_policy:
  default_roles:
    orchestrator:
      - owns_scope_research_task_boundaries_review_verification_docs_commits_and_runtime_checks
      - does_not_delegate_the_immediate_blocker_when_the_next_local_decision_depends_on_it
    worker_agent:
      - coding_hands_with_narrow_task_and_explicit_write_set
      - no_deploy_no_live_sends_no_secrets_no_pii_no_reverts_no_scope_expansion
      - project_local_no_mcp_worker_preferred_when_custom_agents_are_available
      - global_no_mcp_worker_is_fallback_for_project_agnostic_or_missing_project_worker_cases
    reviewer_agent:
      - optional_targeted_review_for_security_db_runtime_deploy_privacy_production_or_broad_changes
      - not_a_replacement_for_orchestrator_judgment
  worker_selection_order:
    - project_local_code_worker_for_project_implementation_and_docs_changes
    - global_code_worker_no_mcp_only_when_project_local_worker_is_unavailable_or_task_is_project_agnostic
    - claude_code_readonly_adapter_only_when_explicitly_requested_or_project_authorized
    - built_in_generic_worker_only_when_no_no_mcp_worker_exists_or_orchestrator_session_is_lightweight
  project_local_worker_files:
    - .codex/config.toml
    - .codex/agents/<project_slug>_code_worker.toml
    - .claude/agents/<project_slug>_readonly_reviewer.md_optional
    - scripts/claude-code-readonly-subagent.sh_optional_helper
  worker_mcp_rules:
    - rich_mcp_orchestrators_may_use_mcp_for_research_connectors_browser_analytics_messaging_or_other_external_operations
    - coding_workers_disable_project_or_operator_mcp_server_ids_in_agent_config
    - claude_code_one_shot_workers_pass_explicit_empty_mcp_config_and_strict_mcp_config
    - kernel_does_not_prescribe_a_fixed_mcp_server_id_list
    - do_not_rely_on_task_prompt_to_disable_mcp_startup
    - worker_that_needs_external_context_returns_needs_context_for_orchestrator
    - when_user_explicitly_requests_claude_code_do_not_silently_fallback_to_gpt_or_codex_on_claude_failure
    - diagnose_claude_code_cli_binary_auth_mcp_tool_output_permission_or_process_failure_before_retry_or_fallback
  concurrency_defaults:
    max_worker_agents_default: 1
    max_worker_agents_parallel: 2
    max_reviewer_agents_default: 1
    max_open_subagent_threads: 3
  parallel_worker_allowed_only_when:
    - write_sets_are_disjoint
    - tests_and_runtime_resources_are_disjoint
    - workers_do_not_touch_shared_deploy_scripts_shared_fixtures_generated_files_live_state_or_same_plan_doc_section
    - orchestrator_can_review_and_integrate_without_guessing
    - local_executor_health_is_normal
  prompt_contract_required_fields:
    - repository_or_worktree_path
    - branch_name
    - task_goal
    - exact_allowed_write_paths
    - forbidden_paths_or_actions
    - live_system_access_rule
    - secret_and_privacy_rules
    - verification_commands
    - return_format
  tool_load_rules:
    - avoid_parallel_shell_or_tool_wrappers_while_worker_agents_are_active
    - prefer_sequential_shell_commands_while_worker_agents_are_active
    - avoid_broad_repeated_file_scans_unless_needed
    - do_not_busy_poll_agents
    - close_completed_or_abandoned_agent_threads_immediately_after_recording_result
  thread_lifecycle_rules:
    - implementation_worker_thread_is_kept_open_only_for_same_patch_review_fix_loop
    - close_implementation_worker_after_patch_accepted_rejected_blocked_or_orchestrator_takes_over
    - close_worker_when_next_task_has_different_write_set_or_prd_slice
    - reviewer_explorer_and_docs_specialist_threads_are_single_use_by_default
    - use_fresh_reviewer_for_re_review_after_fixes
    - every_subagent_final_response_includes_thread_disposition
  thread_disposition_values:
    - parent_may_close_thread
    - keep_open_for_same_patch_fix_loop
    - blocked_needs_context
  recovery_triggers:
    - too_many_open_files
    - stream_disconnected_before_completion
    - failed_to_create_process
  recovery_rules:
    - stop_spawning_agents
    - stop_parallel_shell_and_tool_calls
    - close_completed_or_errored_agent_threads
    - recover_with_minimal_sequential_commands
    - do_not_edit_runtime_code_or_claim_verification_until_git_status_and_git_diff_check_can_run
  integration_rules:
    - verify_changed_files_stay_within_allowed_write_set
    - verify_no_secrets_or_raw_customer_data_were_introduced
    - require_git_diff_check_before_accepting_worker_patch
    - require_focused_tests_or_documented_expected_red_state
    - commit_after_each_accepted_slice_when_feasible
  review_rules:
    - distinguish_spec_compliance_review_from_code_quality_review
    - evaluate_external_reviewer_feedback_technically_not_blindly
    - expected_tdd_red_state_is_not_a_bug_when_documented
  project_override_rule:
    - project_local_agents_md_may_impose_stricter_limits
    - live_production_projects_should_default_to_one_worker_staging_first_no_worker_deploys_and_orchestrator_only_runtime_verification

project_local_worker_policy:
  purpose:
    - let_rich_mcp_orchestrators_keep_external_tools_without_passing_them_to_coding_workers
    - make_project_rules_durable_inside_project_local_worker_configs
    - provide_global_no_mcp_worker_fallback_for_projects_without_local_workers
  preferred_files:
    global_fallback_worker: ~/.codex/agents/code_worker_no_mcp.toml
    project_config: .codex/config.toml
    project_worker: .codex/agents/<project_slug>_code_worker.toml
    optional_project_reviewer: .codex/agents/<project_slug>_reviewer.toml
    optional_project_docs_worker: .codex/agents/<project_slug>_docs_worker.toml
    optional_claude_code_readonly_reviewer: .claude/agents/<project_slug>_readonly_reviewer.md
    optional_claude_code_readonly_wrapper: scripts/claude-code-readonly-subagent.sh
    project_canon: AGENTS.md
  selection_rules:
    - orchestrator_explicitly_selects_project_local_worker_for_project_implementation_and_docs_changes
    - claude_code_adapter_default_role_is_one_shot_readonly_review_or_design_review
    - claude_code_adapter_is_not_default_implementation_worker_without_project_prd
    - add_project_local_specialist_roles_only_after_repeated_need_proves_a_clear_boundary
    - project_local_reviewer_is_read_only_for_diff_spec_safety_privacy_runtime_and_test_gap_review
    - project_local_docs_worker_writes_docs_only_from_orchestrator_evidence_and_project_docs
    - global_code_worker_no_mcp_is_fallback_only_when_project_local_worker_is_missing_or_task_is_project_agnostic
    - built_in_generic_workers_are_not_used_from_rich_mcp_sessions_when_no_mcp_project_worker_exists
  worker_content_rules:
    - include_only_durable_project_rules_not_chat_memory_or_secrets
    - include_project_canon_path_live_access_policy_forbidden_actions_privacy_rules_allowed_local_checks_and_needs_context_rule
    - keep_worker_config_small_and_use_project_docs_skills_runbooks_handoffs_for_domain_knowledge
    - require_thread_disposition_in_worker_final_response
    - dispatch_prompt_names_task_specific_docs_skills_runbooks_or_handoffs_to_read
    - disable_current_project_or_operator_mcp_server_ids_in_worker_config
    - disabled_mcp_entries_still_include_command_or_url_transport_to_avoid_invalid_transport_loader_errors
    - claude_code_oauth_backed_local_runs_do_not_use_bare_by_default
    - claude_code_bare_mode_requires_explicit_api_key_or_api_key_helper_verification
    - claude_code_empty_mcp_config_is_mcpServers_empty_object_not_empty_json_object
    - claude_code_readonly_runs_prefer_direct_binary_over_wrapper_binary
    - claude_code_stream_json_requires_verbose
    - claude_code_readonly_runs_use_dontAsk_not_plan_permission_mode
    - claude_code_readonly_tool_set_is_mode_specific_and_minimal
    - do_not_copy_project_specific_mcp_ids_or_local_paths_from_another_project
    - keep_task_specific_write_sets_and_verification_commands_in_the_dispatch_prompt
  worker_mcp_inventory_rules:
    - inspect_current_orchestrator_mcp_server_ids_before_creating_worker_config
    - disable_only_mcp_servers_that_exist_in_the_operator_or_project_environment
    - each_project_owns_its_mcp_disable_list
    - copy_real_transport_fields_from_the_local_mcp_config_or_applicable_project_config
    - leave_project_specific_mcp_names_in_project_config_not_the_universal_kernel
  verification_rules:
    - parse_global_and_project_worker_toml_before_use
    - run_claude_auth_status_or_project_claude_wrapper_smoke_before_using_claude_code_adapter
    - start_a_fresh_session_after_agent_config_changes
    - verify_worker_availability_before_spawning_workers
    - record_platform_gaps_when_custom_agent_selection_is_unavailable

mcp_tooling_policy:
  preferred_interface: MCP_or_App_connector_when_available
  role:
    - structured_external_service_interface
    - not_a_place_to_store_or_copy_tokens
    - subordinate_to_project_canon_active_prd_and_verification_contracts
  identity_boundaries:
    - github_app_installation_token
    - local_gh_cli_token
    - personal_access_token
    - service_account_or_sandbox_identity
  github_connector_minimum_permissions:
    - repository_access_to_target_repo
    - contents_read_write_when_code_branches_or_files_are_changed
    - issues_read_write_when_issues_are_created_or_updated
    - pull_requests_read_write_when_prs_are_created_or_updated
    - actions_or_workflows_read_write_only_when_workflow_files_or_action_state_are_in_scope
  rules:
    - prefer_mcp_or_app_connector_for_supported_structured_external_service_operations
    - local_cli_tokens_and_mcp_connector_tokens_are_different_identities
    - github_app_installation_permissions_are_configured_in_github_installed_apps_not_in_the_local_gh_token
    - do_not_paste_or_record_tokens_in_repo_docs_prds_or_issue_bodies
    - if_connector_write_fails_check_repository_access_and_app_permissions_before_refreshing_local_cli_auth
    - when_connector_tooling_is_missing_or_blocked_use_the_canonical_cli_fallback_and_record_the_gap_when_it_affects_the_slice
    - github_cli_fallbacks_must_follow_shell_safe_body_file_and_sub_issue_rules
    - verify_live_external_writes_with_a_sandbox_or_low_impact_identity_before_claiming_connector_access_works

research_policy:
  preferred_stack:
    discovery_and_research:
      - Tavily search
      - direct fetch or index of known official URLs
      - manual source reading and synthesis by the agent
      - Tavily research only as an explicitly justified expensive fallback for broad deep sweeps
    known_urls_or_known_docs:
      - fetch_or_index_the_known_url
  slice_classification:
    allowed_values:
      - repo_local_slice
      - external_contract_slice
    repo_local_slice_means:
      - repo_owned_ui_copy_layout_or_navigation_only
      - local_state_or_deterministic_tests_only
      - internal_docs_for_already_verified_repo_behavior_only
    external_contract_slice_means:
      - dependency_source_or_packaging_claims
      - vendor_or_platform_behavior_claims
      - external_auth_or_api_contract_claims
      - interpreter_or_dependency_compatibility_claims
  external_source_of_truth_matrix:
    required_for:
      - external_contract_slice
    required_fields:
      - surface_name
      - project_local_source_of_truth
      - upstream_or_vendor_source
      - exact_version_commit_build_url_or_identifier
      - local_verification_method
      - divergence_notes
  rules:
    - research_is_tavily_search_first_not_tavily_research_first
    - classify_each_non_trivial_slice_as_repo_local_or_external_contract_before_edits
    - repo_local_slice_may_proceed_from_project_truth_deterministic_verification_and_local_runtime_checks
    - external_contract_slice_requires_fresh_external_research_before_code_or_docs_land
    - use_tavily_research_only_when_tavily_search_known_docs_and_manual_synthesis_are_insufficient
    - if_tavily_research_is_used_record_why_lower_cost_search_and_manual_synthesis_were_insufficient
    - use_official_vendor_docs_for_external_contracts
    - distinguish_verified_facts_from_assumptions
    - external_contract_slice_evidence_must_be_recorded_in_the_active_prd_or_decision_note
    - every_external_contract_slice_must_record_an_external_source_of_truth_matrix_before_implementation_lands
    - reconcile_project_local_pins_vendor_docs_and_live_behavior_inside_the_external_source_of_truth_matrix
    - if_repo_local_artifacts_conflict_with_fresh_vendor_docs_or_live_verification_the_conflict_must_be_explicitly_recorded_not_implicitly_ignored
    - if_known_url_exists_fetch_it_directly_instead_of_re-searching_blindly
    - if_primary_tool_is_unavailable_record_the_gap_and_use_the_best_documented_fallback

execution_surface_policy:
  default_surface:
    - local_operator_machine
    - self_hosted_runner_when_project_already_has_one
    - self_hosted_runner_when_project_can_reasonably_provide_one
  github_actions_are_for:
    - repository_native_automation
    - scheduled_workflows
    - deploy_pipelines
    - hosted_verification_that_requires_repository_runtime
    - event_driven_jobs_that_should_run_without_an_operator_terminal
  rules:
    - github_coordinates_repository_workflow_owned_compute_executes_routine_work_by_default
    - do_not_default_to_paid_github_hosted_actions_for_ordinary_development_work
    - paid_github_hosted_runners_dependency_cache_uploads_and_long_lived_artifacts_require_explicit_prd_or_decision_note
    - document_self_hosted_runner_labels_before_enabling_recurring_github_checks
    - if_work_can_run_locally_prefer_local_execution_first
    - detect_local_prerequisites_before_work_starts
    - if_repo_defines_a_local_bootstrap_path_run_it_or_repair_it
    - use_github_actions_only_when_local_or_self_hosted_execution_is_not_the_right_surface

environment_promotion_policy:
  default_environment_classes:
    - local
    - verify
    - staging
    - production
  rules:
    - use_one_codebase_with_multiple_deploy_environments_not_copied_projects
    - document_local_verify_staging_and_production_boundaries_before_launch_hardening
    - local_is_for_developer_or_operator_iteration_and_must_not_be_treated_as_production_data
    - disposable_verify_owns_mutating_automated_tests
    - staging_is_production_like_and_uses_sandbox_or_non_production_provider_identities
    - production_contains_real_users_real_customer_data_and_production_provider_identities
    - production_secrets_and_production_database_urls_must_not_be_used_in_local_config_or_local_tests
    - mutating_automated_tests_must_not_run_against_production
    - schema_and_deploy_changes_move_through_the_repository_auditable_delivery_path
    - project_canon_must_document_the_production_safe_migration_or_deploy_command_before_production_use
    - project_canon_must_document_backup_or_restore_point_path_before_production_migrations
    - production_smoke_checks_should_be_read_safe_unless_a_prd_or_decision_note_approves_the_write_and_rollback_path
    - production_data_may_move_down_to_staging_only_through_documented_backup_restore_and_sanitization
    - local_or_staging_data_must_not_move_up_to_production

behavioral_overlay_policy:
  bootstrap_default: false
  purpose:
    - allow_an_optional_behavior_only_layer_without_replacing_repo_canon_or_the_engineering_kernel
    - keep_one_canonical_overlay_source_syncable_across_claude_cursor_skill_and_plugin_surfaces
  candidate_principles:
    - explicit_assumptions_and_named_confusion
    - simplicity_first
    - surgical_changes
    - goal_driven_verification
  allowed_surfaces:
    - CLAUDE_md_style_root_instruction_file
    - Cursor_project_rule
    - skill_or_plugin_surface
  rules:
    - behavioral_overlay_is_optional_not_bootstrap_default
    - behavioral_overlay_must_stay_thin_relative_to_repo_canon_and_the_engineering_kernel
    - repo_local_canon_remains_higher_priority_than_any_behavioral_overlay
    - if_multiple_agent_surfaces_are_used_keep_one_canonical_overlay_source_and_sync_the_derived_variants
    - do_not_let_claude_cursor_skill_or_plugin_variants_drift_semantically
    - do_not_replace_prd_issue_verification_or_kernel_sync_discipline_with_a_behavior_only_overlay
    - enable_always_apply_or_auto_apply_only_by_explicit_project_choice_not_as_universal_kernel_default

optional_operator_layers:
  - kernel_fleet_sweep_policy

kernel_upstream_awareness_policy:
  protocol_name: kernel_upstream_check
  consumer_metadata_file: .kernel/upstream.json
  canonical_statuses:
    - current
    - update_available
    - not_configured
    - unknown
  required_metadata_fields:
    - kernel_repo
    - kernel_default_branch
    - pinned_commit
  rules:
    - every_serious_consumer_project_slice_should_begin_with_kernel_upstream_check
    - downstream_projects_must_record_an_exact_pinned_kernel_commit
    - kernel_upstream_check_compares_the_pinned_commit_against_upstream_default_branch_head
    - if_update_is_available_record_it_in_the_active_slice_or_open_or_update_a_project_local_task
    - kernel_updates_must_not_auto_apply_blindly_to_downstream_projects
    - kernel_adoption_remains_a_normal_project_local_slice_with_prd_issue_verification_and_merge
    - urgent_incident_work_may_defer_kernel_adoption_but_must_not_hide_the_drift
    - optional_operator_fleet_checks_may_call_the_same_protocol_across_multiple_repositories_but_are_not_bootstrap_default

kernel_adoption_task_policy:
  work_item_name: kernel_adoption_task
  issue_type: Task
  trigger_status:
    - update_available
  canonical_decisions:
    - adopt_now
    - defer
    - not_applicable
  required_fields:
    - target_upstream_commit
    - current_pinned_commit
    - kernel_delta_reference
    - decision
    - local_write_scope
    - verification_plan
  rules:
    - if_kernel_upstream_check_reports_update_available_open_or_update_one_kernel_adoption_task_unless_the_active_slice_explicitly_defers_adoption
    - kernel_adoption_task_is_the_canonical_downstream_work_item_name_for_kernel_updates
    - kernel_adoption_task_must_record_a_decision_of_adopt_now_defer_or_not_applicable
    - kernel_adoption_task_must_capture_target_commit_current_pin_delta_summary_and_verification_plan
    - advance_dot_kernel_upstream_json_only_after_adoption_is_implemented_and_verified
    - defer_and_not_applicable_decisions_must_record_why_and_when_to_revisit
    - do_not_spawn_duplicate_kernel_adoption_tasks_for_the_same_unresolved_kernel_delta

kernel_fleet_sweep_policy:
  protocol_name: kernel_fleet_sweep
  bootstrap_default: false
  default_config_path: ~/.config/agent-engineering-kernel/fleet-repos.json
  preferred_inputs:
    - explicit_repo_paths
    - operator_local_config_file
  per_repo_statuses:
    - current
    - update_available
    - not_configured
    - unknown
  rules:
    - kernel_fleet_sweep_is_operator_local_and_optional
    - prefer_consumer_repo_checker_when_present
    - fallback_to_kernel_checker_with_consumer_metadata_when_consumer_checker_is_missing
    - support_cli_repo_paths_and_config_file_repo_paths
    - never_auto_apply_kernel_updates_from_fleet_sweep
    - if_attention_is_found_turn_it_into_normal_project_local_adoption_work_or_documented_deferral

kernel_sync_policy:
  protocol_name: kernel_sync_review
  decision_field: kernel_impact
  allowed_kernel_impact_values:
    - none
    - project_local_only
    - promote_to_kernel
  rules:
    - every_serious_slice_must_end_with_kernel_sync_review
    - do_not_create_a_separate_skill_name_for_kernel_sync_when_engineering_kernel_already_applies
    - promote_only_reusable_process_or_pattern_learnings_not_project_specific_operational_details
    - kernel_impact_must_be_recorded_in_the_active_prd_or_closeout
    - if_kernel_impact_is_promote_to_kernel_open_or_update_work_in_the_kernel_repo
    - if_learning_is_project_specific_keep_it_in_project_local_canon_not_the_universal_kernel
    - kernel_sync_review_happens_after_live_verification_not_before
    - do_not_use_kernel_sync_review_as_a_substitute_for_kernel_upstream_check

github_issue_tree:
  parent: Epic
  executable_leafs:
    - Task
    - Bug
  rules:
    - non_trivial_work_starts_from_parent_issue
    - use_sub_issues_for_multi_slice_work
    - pr_closes_leaf_issue_only
    - parent_epic_closes_after_acceptance_and_live_verification

automatic_bug_intake:
  canonical_sources:
    - verifier
    - watchdog
    - readiness_gates
    - normalized_runtime_incident_surfaces
  rules:
    - do_not_create_bug_issues_directly_from_raw_logs
    - do_not_create_bug_issues_directly_from_chat_or_telegram_alerts
    - one_bug_class_maps_to_one_stable_fingerprint
    - update_existing_open_bug_issue_when_fingerprint_matches
    - create_new_bug_issue_only_when_no_open_match_exists
    - require_threshold_or_confirmed_terminal_state_before_bug_creation
    - issue_body_must_include_fingerprint_surface_impact_and_evidence
    - close_bug_issue_only_after_recovery_is_verified_by_the_same_canonical_surface

github_delivery_flow:
  preferred_sequence:
    - create_or_update_prd
    - open_parent_issue_if_needed
    - create_leaf_issue
    - create_branch_from_leaf_issue
    - capture_baseline_verification_when_relevant
    - implement_in_small_slice
    - open_or_update_draft_pr
    - run_post_change_verification
    - mark_pr_ready
    - squash_merge
    - delete_head_branch
  rules:
    - use_draft_pr_while_scope_or_verification_is_still_moving
    - keep_pr_description_aligned_with_real_scope_and_verification
    - merge_only_after_required_checks_and_reviews_are_satisfied
    - prefer_squash_merge_for_single_slice_history_unless_project_canon_overrides_it
    - auto_bug_intake_should_open_or_update_the_bug_issue_before_fix_delivery_begins
    - when_using_gh_issue_or_pr_commands_from_shell_prefer_body_file_over_inline_body
    - prefer_mcp_or_app_connector_for_structured_github_issue_pr_and_metadata_operations_when_available_and_authorized
    - local_gh_auth_and_github_app_connector_auth_are_different_identities_with_separate_permissions
    - if_github_connector_returns_resource_not_accessible_by_integration_check_installed_github_app_repository_access_and_permissions
    - never_embed_markdown_with_backticks_in_inline_double_quoted_gh_body_arguments
    - single_quoted_heredoc_is_an_acceptable_fallback_only_when_it_writes_the_body_file_first
    - when_linking_sub_issues_from_cli_prefer_the_kernel_helper_or_graphql_addSubIssue_after_resolving_issue_node_ids
    - if_using_the_rest_add_sub_issue_endpoint_remember_that_sub_issue_id_means_child_issue_database_id_not_issue_number
    - github_projects_are_optional_not_bootstrap_default
    - adopt_github_projects_only_when_issue_first_execution_needs_shared_custom_fields_iterations_roadmaps_or_cross_repo_planning
    - do_not_require_github_projects_for_data_driven_non_engineering_lanes

pr_verification_contract:
  required_fields:
    - linked_leaf_issue
    - parent_context
    - scope
    - baseline_verification
    - verification
    - rollback_path
  minimum_checks:
    - pre_change_baseline_when_existing_contract_exists
    - code_path_tests
    - build_or_runtime_checks
    - source_of_truth_or_sync_checks
    - live_checks_when_runtime_or_state_is_touched
    - sandbox_identity_for_live_external_writes
  live_external_identity_rules:
    - if_live_verification_can_write_to_external_state_use_explicit_sandbox_identity
    - never_use_operator_or_production_identities_as_test_identities
    - if_more_identities_are_needed_provision_and_record_more_sandboxes_before_testing
    - fail_closed_when_required_sandbox_identity_or_resource_ids_are_not_configured

ownership_and_metadata:
  required_files:
    - CODEOWNERS
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/epic.yml
    - .github/ISSUE_TEMPLATE/task.yml
    - .github/ISSUE_TEMPLATE/bug.yml
    - .github/pull_request_template.md
    - .github/labels.yml
    - scripts/sync_github_labels.py
  rules:
    - labels_are_source_of_truth_not_ui_drift
    - ownership_should_exist_even_before_platform_enforcement
    - bootstrap_should_materialize_repo_managed_metadata_not_retype_it
    - bug_issue_forms_should_capture_fingerprint_and_runtime_evidence

community_health:
  required_files:
    - CODE_OF_CONDUCT.md
    - SECURITY.md
  recommended_files:
    - LICENSE
  rules:
    - kernel_repo_itself_should_follow_the_same_health_baseline
    - project_templates_should_ship_with_code_of_conduct_and_security_policy
    - license_selection_may_remain_project_specific

model_adapter_policy:
  shared_core_must_match:
    - prd_first_execution
    - agent_skill_orchestration_policy
    - mcp_tooling_policy
    - github_issue_tree
    - verification_contract
    - documentation_discipline
    - final_reporting_discipline
  adapter_scope_only:
    - tool_selection
    - shell_or_editor_constraints
    - verbosity
    - planning_mechanics
    - platform_specific_skills_plugins_or_commands
  claude_code_subagent_adapter:
    default_role: readonly_one_shot_reviewer_or_design_reviewer
    preferred_binary: "$HOME/.local/bin/claude"
    wrapper_binaries_explicit_opt_in: true
    default_model: claude-opus-4-7
    output_format: stream-json
    verbose_required_for_stream_json: true
    permission_mode: dontAsk
    forbidden_permission_modes:
      - plan
    mode_tool_allowlists:
      smoke: []
      review-files:
        - Read
      review-repo:
        - Read
        - Grep
        - Glob
    default_mcp_config: '{"mcpServers":{}}'
    strict_mcp_config_required: true
    no_session_persistence_default: true
    bare_mode_default: false
    default_max_budget_usd_by_mode:
      smoke: 1
      review-files: 5
      review-repo: 10
    no_silent_fallback_when_explicitly_requested: true
    default_wrapper: scripts/claude-code-readonly-subagent.sh
  primary_target: GPT-5.4/Codex
  secondary_target: Claude Code
  hard_rule:
    - do_not_fork_the_engineering_process_by_model

bootstrap:
  when_new_repo_starts:
    - inspect_repo_reality
    - install_minimal_core
    - record_plan_gated_maximum_layer_separately
    - leave_durable_project_docs_not_chat_memory
    - use_templates_and_sync_scripts_instead_of_recreating_github_metadata_manually
