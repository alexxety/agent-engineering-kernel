version: 1
name: universal-agent-engineering-kernel
scope: multi-project
purpose:
  - establish one reusable engineering workflow for agent-led software development
  - stop serious work from starting as chat-only improvisation
  - preserve PRD-first execution and GitHub issue decomposition across repositories
  - keep the shared process model-agnostic across GPT/Codex and Claude-style agents

layers:
  minimal_core:
    - project_local_canon
    - prd_first_execution
    - research_policy
    - execution_surface_policy
    - kernel_sync_policy
    - github_issue_tree
    - automatic_bug_intake
    - github_delivery_flow
    - pr_verification_contract
    - ownership_and_metadata
  maximum_practical_core:
    - protected_branch_or_ruleset_enforcement
    - required_approvals
    - stale_review_dismissal
    - code_owner_review
    - required_status_checks
    - github_projects_and_issue_types
    - merge_policy_enforcement
    - automatic_head_branch_deletion

project_local_canon:
  required_files:
    - README.md
    - AGENTS.md
    - CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - SECURITY.md
  required_sections:
    - source_of_truth
    - workflow_order
    - verification_matrix
    - rollback_rule
  rules:
    - prefer_project_local_canon_over_chat_memory
    - create_local_canon_if_missing

prd_first_execution:
  order:
    - research
    - code_audit
    - reconciliation
    - documentation_first
    - implementation
    - verification
  rules:
    - non_trivial_work_must_not_start_with_code
    - verification_defined_before_edits
    - docs_and_prd_are_part_of_the_slice

research_policy:
  preferred_stack:
    discovery_and_research:
      - Tavily search
      - Tavily research
    known_urls_or_known_docs:
      - fetch_or_index_the_known_url
  rules:
    - research_is_tavily_first
    - use_official_vendor_docs_for_external_contracts
    - distinguish_verified_facts_from_assumptions
    - if_known_url_exists_fetch_it_directly_instead_of_re-searching_blindly
    - if_primary_tool_is_unavailable_record_the_gap_and_use_the_best_documented_fallback

execution_surface_policy:
  default_surface:
    - local_operator_machine
    - self_hosted_runner_when_project_already_has_one
  github_actions_are_for:
    - repository_native_automation
    - scheduled_workflows
    - deploy_pipelines
    - hosted_verification_that_requires_repository_runtime
    - event_driven_jobs_that_should_run_without_an_operator_terminal
  rules:
    - do_not_default_to_paid_github_hosted_actions_for_ordinary_development_work
    - if_work_can_run_locally_prefer_local_execution_first
    - detect_local_prerequisites_before_work_starts
    - if_repo_defines_a_local_bootstrap_path_run_it_or_repair_it
    - use_github_actions_only_when_local_or_self_hosted_execution_is_not_the_right_surface

kernel_sync_policy:
  protocol_name: kernel_sync_review
  decision_field: kernel_impact
  allowed_kernel_impact_values:
    - none
    - project_local_only
    - promote_to_kernel
  rules:
    - every_serious_slice_must_end_with_kernel_sync_review
    - do_not_create_a_separate_skill_name_for_kernel_sync_when_engineering_kernel_already_applies
    - promote_only_reusable_process_or_pattern_learnings_not_project_specific_operational_details
    - kernel_impact_must_be_recorded_in_the_active_prd_or_closeout
    - if_kernel_impact_is_promote_to_kernel_open_or_update_work_in_the_kernel_repo
    - if_learning_is_project_specific_keep_it_in_project_local_canon_not_the_universal_kernel
    - kernel_sync_review_happens_after_live_verification_not_before

github_issue_tree:
  parent: Epic
  executable_leafs:
    - Task
    - Bug
  rules:
    - non_trivial_work_starts_from_parent_issue
    - use_sub_issues_for_multi_slice_work
    - pr_closes_leaf_issue_only
    - parent_epic_closes_after_acceptance_and_live_verification

automatic_bug_intake:
  canonical_sources:
    - verifier
    - watchdog
    - readiness_gates
    - normalized_runtime_incident_surfaces
  rules:
    - do_not_create_bug_issues_directly_from_raw_logs
    - do_not_create_bug_issues_directly_from_chat_or_telegram_alerts
    - one_bug_class_maps_to_one_stable_fingerprint
    - update_existing_open_bug_issue_when_fingerprint_matches
    - create_new_bug_issue_only_when_no_open_match_exists
    - require_threshold_or_confirmed_terminal_state_before_bug_creation
    - issue_body_must_include_fingerprint_surface_impact_and_evidence
    - close_bug_issue_only_after_recovery_is_verified_by_the_same_canonical_surface

github_delivery_flow:
  preferred_sequence:
    - create_or_update_prd
    - open_parent_issue_if_needed
    - create_leaf_issue
    - create_branch_from_leaf_issue
    - implement_in_small_slice
    - open_or_update_draft_pr
    - run_verification
    - mark_pr_ready
    - squash_merge
    - delete_head_branch
  rules:
    - use_draft_pr_while_scope_or_verification_is_still_moving
    - keep_pr_description_aligned_with_real_scope_and_verification
    - merge_only_after_required_checks_and_reviews_are_satisfied
    - prefer_squash_merge_for_single_slice_history_unless_project_canon_overrides_it
    - auto_bug_intake_should_open_or_update_the_bug_issue_before_fix_delivery_begins

pr_verification_contract:
  required_fields:
    - linked_leaf_issue
    - parent_context
    - scope
    - verification
    - rollback_path
  minimum_checks:
    - code_path_tests
    - build_or_runtime_checks
    - source_of_truth_or_sync_checks
    - live_checks_when_runtime_or_state_is_touched

ownership_and_metadata:
  required_files:
    - CODEOWNERS
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/epic.yml
    - .github/ISSUE_TEMPLATE/task.yml
    - .github/ISSUE_TEMPLATE/bug.yml
    - .github/pull_request_template.md
    - .github/labels.yml
    - scripts/sync_github_labels.py
  rules:
    - labels_are_source_of_truth_not_ui_drift
    - ownership_should_exist_even_before_platform_enforcement
    - bootstrap_should_materialize_repo_managed_metadata_not_retype_it
    - bug_issue_forms_should_capture_fingerprint_and_runtime_evidence

community_health:
  required_files:
    - CODE_OF_CONDUCT.md
    - SECURITY.md
  recommended_files:
    - LICENSE
  rules:
    - kernel_repo_itself_should_follow_the_same_health_baseline
    - project_templates_should_ship_with_code_of_conduct_and_security_policy
    - license_selection_may_remain_project_specific

model_adapter_policy:
  shared_core_must_match:
    - prd_first_execution
    - github_issue_tree
    - verification_contract
    - documentation_discipline
    - final_reporting_discipline
  adapter_scope_only:
    - tool_selection
    - shell_or_editor_constraints
    - verbosity
    - planning_mechanics
    - platform_specific_skills_plugins_or_commands
  primary_target: GPT-5.4/Codex
  secondary_target: Claude Code
  hard_rule:
    - do_not_fork_the_engineering_process_by_model

bootstrap:
  when_new_repo_starts:
    - inspect_repo_reality
    - install_minimal_core
    - record_plan_gated_maximum_layer_separately
    - leave_durable_project_docs_not_chat_memory
    - use_templates_and_sync_scripts_instead_of_recreating_github_metadata_manually
